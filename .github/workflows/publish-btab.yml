name: Publish BTAB Learning 1.1.0
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-btab.yml']
permissions:
  contents: write
concurrency:
  group: publish-btab-v1.1.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Restore and verify the prepared package
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, pathlib, zipfile, json
          assets = json.loads('[{"name": "btab-learning-v1.1.0.zip", "sha256": "ff68b632c01c6aa0c9b8edf55625c37b15ddebef4510bb322dbc72cd2334434b", "data": ""}, {"name": "btab-learning-skill-v1.1.0.zip", "sha256": "dad9770ebb0a9180f759fa577b60ac2f652cdd25a322b9bf3b2536b78a0be6a1", "data": ""}]')
          for asset in assets:
              payload = base64.b64decode(asset['data'])
              assert hashlib.sha256(payload).hexdigest() == asset['sha256']
              path = pathlib.Path(asset['name'])
              path.write_bytes(payload)
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
          PYCODE
      - name: Publish the verified package
        shell: bash
        env:
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:           ${{ github.repository }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'Release already exists; preserving its assets.'
            exit 0
          fi
          gh release create v1.1.0 btab-learning-v1.1.0.zip btab-learning-skill-v1.1.0.zip --title 'BTAB Learning 1.1.0' --notes 'Adds the BTAB Learning automatic router. Includes a ChatGPT plugin package and a standalone skill archive for Gemini and Claude. Choose the appropriate archive for your assistant; follow the Quick start in the repository.'
