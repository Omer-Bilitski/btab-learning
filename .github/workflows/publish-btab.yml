name: Publish BTAB Learning 1.0.1
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-btab.yml']
permissions:
  contents: write
concurrency:
  group: publish-btab-v1.0.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Restore and verify the prepared package
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, pathlib, zipfile
          payload = base64.b64decode('')
          expected = 'f1cfd529959e0e2357b572211f0a313fc8f93aa6ec98e3ba053c47ec5c8a5d66'
          assert hashlib.sha256(payload).hexdigest() == expected
          path = pathlib.Path('btab-learning-v1.0.1.zip')
          path.write_bytes(payload)
          pathlib.Path('btab-learning-v1.0.1.sha256').write_text(expected + '  ' + path.name + '\n')
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None
              assert len([n for n in archive.namelist() if n.endswith('/SKILL.md')]) == 3
          PYCODE
      - name: Publish the verified package
        shell: bash
        env:
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:           ${{ github.repository }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo 'Release already exists; preserving its assets.'
            exit 0
          fi
          gh release create v1.0.1 btab-learning-v1.0.1.zip btab-learning-v1.0.1.sha256 --title 'BTAB Learning 1.0.1' --notes 'Three teaching skills. Adds discovery of the authenticated owner personal private BTAB journal when configured. No surveys or automatic teaching edits. The ZIP download counter is maintained by GitHub; it is not a unique-user count.'
