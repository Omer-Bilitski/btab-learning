name: Publish owner-approved BTAB Learning 1.2.6
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/release-approved-1.2.6.yml']
permissions:
  contents: write
concurrency:
  group: btab-approved-release-1.2.6
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate approved annotation policy
        run: |
          python3 - <<'PY'
          import base64,zlib,json,pathlib
          files=json.loads(zlib.decompress(base64.b64decode('')))
          for name,text in files.items():
              path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8',newline='\n')
          PY
          git add README.md plugin.json plugins skills scripts/build-approved-1.2.5.py scripts/build-approved-1.2.6.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply owner-approved image delivery policy 1.2.6'
            git push
          fi
      - name: Validate and package the approved changes
        run: python3 scripts/build-approved-1.2.6.py dist
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.6 >/dev/null 2>&1; then
            echo 'Release already exists; preserving published files.'
            exit 0
          fi
          gh release create v1.2.6 dist/btab-learning-v1.2.6.zip dist/btab-learning-skill-v1.2.6.zip dist/check-my-work-v1.2.6.zip dist/SHA256SUMS.txt --target main --title 'BTAB Learning 1.2.6 â€” Image-input-aware annotation fallback' --notes 'Check My Work now explicitly attempts an annotated copy of uploaded work by default on every supported host. If no image can be delivered, the written review must state the observed reason or acknowledge an unknown cause. Text-only input receives no image-status notice. Includes the standalone skill, unified skill and full plugin; no new tools or account permissions are provisioned.'
