name: Publish BTAB Learning 1.2.1
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-personal-learning.yml']
permissions:
  contents: write
concurrency:
  group: publish-btab-v1.2.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and restore prepared source and archives
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, io, json, pathlib, zipfile
          source = base64.b64decode('')
          assert hashlib.sha256(source).hexdigest() == 'f2dc86bdd844e4fe0e551fb67f18ac90f8ea0a65669372f6ac625cf1386122e3'
          with zipfile.ZipFile(io.BytesIO(source)) as archive:
              assert archive.testzip() is None
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in archive.namelist())
              archive.extractall('.')
          assets = [{'name': 'btab-learning-v1.2.1.zip', 'sha256': '8f96f07baa53c5db1250620b6b7101bc50553b9c654de78d894a04bd90af7605', 'data': ''}, {'name': 'btab-learning-skill-v1.2.1.zip', 'sha256': 'c26945ccb75e146baf755d3279082264d42064b7bb40955c15392db5658dc1e9', 'data': ''}, {'name': 'check-my-work-v1.2.1.zip', 'sha256': '23c625c2bc3c7f38c5adf45956faee56d880adc5d97e86341de010535e288234', 'data': ''}]
          checks = []
          for asset in assets:
              data = base64.b64decode(asset['data'])
              assert hashlib.sha256(data).hexdigest() == asset['sha256']
              pathlib.Path(asset['name']).write_bytes(data)
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  assert archive.testzip() is None
              checks.append(asset['sha256'] + '  ' + asset['name'])
          pathlib.Path('SHA256SUMS.txt').write_text('\n'.join(checks) + '\n')
          assert json.loads(pathlib.Path('plugin.json').read_text())['version'] == '1.2.1'
          PYCODE
      - name: Commit updated teaching source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin.json skills
          if ! git diff --cached --quiet; then
            git commit -m 'Add personal explanation preferences and weekly improvement proposals (1.2.1)'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish version 1.2.1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.1 >/dev/null 2>&1; then
            echo 'Release exists; preserving assets.'
            exit 0
          fi
          gh release create v1.2.1 btab-learning-v1.2.1.zip btab-learning-skill-v1.2.1.zip check-my-work-v1.2.1.zip SHA256SUMS.txt --target "$(git rev-parse HEAD)" --title 'BTAB Learning 1.2.1 — Personal learning preferences' --notes 'Learns how each user prefers explanations from explicit preferences and observable feedback. Weekly reviews propose specific improvements for individual approval. Approved personal guidance stays separate from the public package. Persistent learning requires a configured personal journal; proactive weekly reviews also require an authorized scheduler. Includes all four teaching modes, updated source, and plugin and standalone skill downloads.'
