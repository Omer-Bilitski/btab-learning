name: Publish BTAB Learning 1.2.0
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-check-my-work.yml']
permissions:
  contents: write
concurrency:
  group: publish-btab-v1.2.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Restore and verify prepared archives
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, pathlib, zipfile, json
          assets = json.loads('[{"name": "btab-learning-v1.2.0.zip", "sha256": "2c37ff6f6949715a5e3fa7b4bb9448700b65f062a24bef8e9e0f555ece86aaa2", "data": ""}, {"name": "btab-learning-skill-v1.2.0.zip", "sha256": "bf51a368b4847cc059242c3b2d68e54f8993073a9de1764aab74b62478dcde0c", "data": ""}, {"name": "check-my-work-v1.2.0.zip", "sha256": "6d9f9183d634a11fdd9790274033dd4b5bccc18bedcd1ac4599ed6df197855ca", "data": ""}]')
          checks = []
          for asset in assets:
              data = base64.b64decode(asset['data'])
              assert hashlib.sha256(data).hexdigest() == asset['sha256']
              pathlib.Path(asset['name']).write_bytes(data)
              with zipfile.ZipFile(asset['name']) as z:
                  assert z.testzip() is None
              checks.append(asset['sha256'] + '  ' + asset['name'])
          pathlib.Path('SHA256SUMS.txt').write_text('\n'.join(checks) + '\n')
          PYCODE
      - name: Publish version 1.2.0
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo 'Release exists; preserving assets.'
            exit 0
          fi
          gh release create v1.2.0 btab-learning-v1.2.0.zip btab-learning-skill-v1.2.0.zip check-my-work-v1.2.0.zip SHA256SUMS.txt --title 'BTAB Learning 1.2.0 — Check My Work' --notes 'Adds Check My Work: review your mathematics or physics attempt, preserve your approach, locate the first substantive error, and explain a local correction. The BTAB Learning automatic router now includes all four teaching modes. Download the plugin archive for ChatGPT, the unified skill archive for skill-compatible assistants, or the standalone Check My Work archive.'
