name: Publish BTAB Learning 1.2.2
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-check-my-work.yml']
permissions:
  contents: write
concurrency:
  group: publish-btab-v1.2.2
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Restore and verify prepared archives
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, pathlib, zipfile, json
          assets = json.loads('[{"name": "btab-learning-v1.2.2.zip", "sha256": "fda0eb43d37b901aca2b3aaeb1d907f867019614556f185fc4279d18df21488d", "data": ""}, {"name": "btab-learning-skill-v1.2.2.zip", "sha256": "592ff83c630199dd248ec4ddf211c37df8409d29c7127e149081d21feb79172c", "data": ""}, {"name": "check-my-work-v1.2.2.zip", "sha256": "8dec55bda28a59a1199c166e0301997abc581c3630ab13cb812eb73da7ce6623", "data": ""}]')
          checks = []
          for asset in assets:
              data = base64.b64decode(asset['data'])
              assert hashlib.sha256(data).hexdigest() == asset['sha256']
              pathlib.Path(asset['name']).write_bytes(data)
              with zipfile.ZipFile(asset['name']) as z:
                  assert z.testzip() is None
              checks.append(asset['sha256'] + '  ' + asset['name'])
          pathlib.Path('SHA256SUMS.txt').write_text('\n'.join(checks) + '\n')
          PYCODE
      - name: Publish version 1.2.2
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.2 >/dev/null 2>&1; then
            echo 'Release exists; preserving assets.'
            exit 0
          fi
          gh release create v1.2.2 btab-learning-v1.2.2.zip btab-learning-skill-v1.2.2.zip check-my-work-v1.2.2.zip SHA256SUMS.txt --title 'BTAB Learning 1.2.2 — Check My Work' --notes 'Adds Check My Work: review your mathematics or physics attempt, preserve your approach, locate the first substantive error, and explain a local correction. The BTAB Learning automatic router now includes all four teaching modes. Download the plugin archive for ChatGPT, the unified skill archive for skill-compatible assistants, or the standalone Check My Work archive.'
