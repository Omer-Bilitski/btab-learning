name: Publish BTAB Learning 1.2.1
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-check-my-work.yml']
permissions:
  contents: write
concurrency:
  group: publish-btab-v1.2.1
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Restore and verify prepared archives
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, pathlib, zipfile, json
          assets = json.loads('[{"name": "btab-learning-v1.2.1.zip", "sha256": "32277c37d10510db5c38a0f77308eee317b8a37a8d0ae3ff1510d997c55f992a", "data": ""}, {"name": "btab-learning-skill-v1.2.1.zip", "sha256": "5dbaf21b832587b8402002dc6a564e4b6b195f4335cad4c4b71dcafbef783a23", "data": ""}, {"name": "check-my-work-v1.2.1.zip", "sha256": "36a7c0320fa421bd613d629a0596a354c88e9519780e1f5be4e6041326522092", "data": ""}]')
          checks = []
          for asset in assets:
              data = base64.b64decode(asset['data'])
              assert hashlib.sha256(data).hexdigest() == asset['sha256']
              pathlib.Path(asset['name']).write_bytes(data)
              with zipfile.ZipFile(asset['name']) as z:
                  assert z.testzip() is None
              checks.append(asset['sha256'] + '  ' + asset['name'])
          pathlib.Path('SHA256SUMS.txt').write_text('\n'.join(checks) + '\n')
          PYCODE
      - name: Publish version 1.2.1
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.1 >/dev/null 2>&1; then
            echo 'Release exists; preserving assets.'
            exit 0
          fi
          gh release create v1.2.1 btab-learning-v1.2.1.zip btab-learning-skill-v1.2.1.zip check-my-work-v1.2.1.zip SHA256SUMS.txt --title 'BTAB Learning 1.2.1 — Check My Work' --notes 'Adds Check My Work: review your mathematics or physics attempt, preserve your approach, locate the first substantive error, and explain a local correction. The BTAB Learning automatic router now includes all four teaching modes. Download the plugin archive for ChatGPT, the unified skill archive for skill-compatible assistants, or the standalone Check My Work archive.'
