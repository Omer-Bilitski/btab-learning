name: Publish BTAB Learning 1.2.3 red annotations
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publish-check-my-work.yml']
permissions:
  contents: write
concurrency:
  group: btab-approved-distribution
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify release archives from source
        run: |
          python3 - <<'PY'
          import pathlib, json, zipfile, hashlib
          root = pathlib.Path('.')
          version = '1.2.3'
          source = root / 'skills'
          required = [source/'check-my-work/SKILL.md', source/'btab-learning/references/check-my-work.md']
          for p in required:
              text = p.read_text()
              assert '## Annotate the submitted work' in text
              assert 'alongside the written' in text
          manifest = json.loads((root/'plugin.json').read_text())
          manifest['version'] = version
          manifest_bytes = (json.dumps(manifest, indent=2)+'\n').encode()
          (root/'plugin.json').write_bytes(manifest_bytes)
          def pack(name, files):
              with zipfile.ZipFile(name, 'w', zipfile.ZIP_DEFLATED) as z:
                  for target, data in sorted(files.items()):
                      z.writestr(target, data)
              with zipfile.ZipFile(name) as z:
                  assert z.testzip() is None
                  assert all('..' not in pathlib.PurePosixPath(p).parts for p in z.namelist())
                  texts = [z.read(p).decode() for p in z.namelist() if p.endswith(('check-my-work/SKILL.md','references/check-my-work.md'))]
                  assert texts and all('## Annotate the submitted work' in t for t in texts)
          all_skills = {f'btab-learning/{p.as_posix()}':p.read_bytes() for p in source.rglob('*') if p.is_file()}
          pack(f'btab-learning-v{version}.zip', {'btab-learning/plugin.json':manifest_bytes, **all_skills})
          unified = {f'btab-learning/{p.relative_to(source/"btab-learning").as_posix()}':p.read_bytes() for p in (source/'btab-learning').rglob('*') if p.is_file()}
          pack(f'btab-learning-skill-v{version}.zip', unified)
          standalone = {f'check-my-work/{p.relative_to(source/"check-my-work").as_posix()}':p.read_bytes() for p in (source/'check-my-work').rglob('*') if p.is_file()}
          pack(f'check-my-work-v{version}.zip', standalone)
          sums = [hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(root.glob('*-v1.2.3.zip'))]
          assert len(sums) == 3
          (root/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          PY
      - name: Publish version 1.2.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.2.3 >/dev/null 2>&1; then
            echo 'Release exists; preserving published assets.'
          else
            gh release create v1.2.3 ./*-v1.2.3.zip SHA256SUMS.txt --target "$(git rev-parse HEAD)" --latest --title 'BTAB Learning 1.2.3 — Red worksheet annotations' --notes 'Check My Work now returns red annotations on photographed or scanned attempts alongside written feedback. Preserves original handwriting, marks exact error locations, labels assumption-dependent corrections, and checks annotations before delivery. Includes the full plugin, unified BTAB skill, and standalone Check My Work archives. Image editing requires a compatible assistant capability.'
          fi
